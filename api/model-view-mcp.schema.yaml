$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:visualise-ai:model-view-mcp:2.0.0
title: Prospective model, view and MCP contract (issue 76; not runtime availability)
description: >-
  Source definitions for future generated REST events, MCP schemas and client types.
  urn:visualise-ai:rest:1.1.0 resolves locally to api/openapi.yaml. Behavioral rules,
  including atomicity, ID uniqueness and final-state references, are in the guide.
$defs:
  Version: { type: string, const: '2.0.0' }
  ProjectId: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/ProjectId' }
  RunId: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/RunId' }
  AgentId: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/AgentId' }
  ComponentId: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/ComponentId' }
  Identifier: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/Identifier' }
  Uuid: { type: string, format: uuid }
  Timestamp: { type: string, format: date-time, pattern: 'Z$' }
  Revision: { type: integer, minimum: 0, maximum: 9007199254740991 }
  Cursor: { type: string, minLength: 1, maxLength: 2048 }
  NextCursor: { oneOf: [{ $ref: '#/$defs/Cursor' }, { type: 'null' }] }
  Component: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/Component' }
  Relationship: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/Relationship' }
  AddedComponent:
    allOf: [{ $ref: '#/$defs/Component' }]
    type: object
    properties:
      description: { type: string, maxLength: 16000 }
      tags: { type: array, maxItems: 100 }
  AddedRelationship:
    allOf: [{ $ref: '#/$defs/Relationship' }]
    type: object
    properties:
      label: { type: string, maxLength: 16000 }
      protocol: { type: string, maxLength: 16000 }
      operation: { type: string, maxLength: 16000 }
      channel: { type: string, maxLength: 16000 }
  ComponentIds:
    type: array
    maxItems: 200
    uniqueItems: true
    items: { $ref: '#/$defs/ComponentId' }
  RelationshipIds:
    type: array
    maxItems: 200
    uniqueItems: true
    items: { $ref: '#/$defs/Identifier' }
  Scope:
    type: object
    required: [componentIds, relationshipIds]
    additionalProperties: false
    properties:
      componentIds: { $ref: '#/$defs/ComponentIds' }
      relationshipIds: { $ref: '#/$defs/RelationshipIds' }
  MissingViewReferences:
    description: Union of up to 200 selected and 200 collapsed component IDs.
    type: object
    required: [componentIds, relationshipIds]
    additionalProperties: false
    properties:
      componentIds:
        type: array
        maxItems: 400
        uniqueItems: true
        items: { $ref: '#/$defs/ComponentId' }
      relationshipIds: { $ref: '#/$defs/RelationshipIds' }
  Target:
    oneOf:
      - type: object
        required: [type, id]
        additionalProperties: false
        properties:
          type: { const: component }
          id: { $ref: '#/$defs/ComponentId' }
      - type: object
        required: [type, id]
        additionalProperties: false
        properties:
          type: { const: relationship }
          id: { $ref: '#/$defs/Identifier' }
  Element:
    oneOf:
      - type: object
        required: [type, value]
        additionalProperties: false
        properties:
          type: { const: component }
          value: { $ref: '#/$defs/Component' }
      - type: object
        required: [type, value]
        additionalProperties: false
        properties:
          type: { const: relationship }
          value: { $ref: '#/$defs/Relationship' }
  Diagnostics:
    description: Bounded diagnostics; diagnosticOverflow signals more issues exist.
    type: array
    maxItems: 200
    items:
      type: object
      required: [code, target, message]
      additionalProperties: false
      properties:
        code: { enum: [missing_reference, hierarchy_cycle, historical_id_reuse] }
        target: { $ref: '#/$defs/Target' }
        message: { type: string, minLength: 1, maxLength: 1000 }
  ReadIdentity:
    type: object
    required: [contractVersion, projectId]
    properties:
      contractVersion: { $ref: '#/$defs/Version' }
      projectId: { $ref: '#/$defs/ProjectId' }
  Page:
    type: object
    properties:
      limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
      cursor: { $ref: '#/$defs/Cursor' }
  Counters:
    type: object
    required: [projectId, modelRevision, projectPosition]
    properties:
      projectId: { $ref: '#/$defs/ProjectId' }
      modelRevision: { $ref: '#/$defs/Revision' }
      projectPosition: { $ref: '#/$defs/Revision' }
  WriteIdentity:
    allOf: [{ $ref: '#/$defs/ReadIdentity' }]
    type: object
    required: [clientEventId, runId, agentId, parentAgentId, occurredAt]
    properties:
      clientEventId: { $ref: '#/$defs/Uuid' }
      runId: { $ref: '#/$defs/RunId' }
      agentId: { $ref: '#/$defs/AgentId' }
      parentAgentId: { oneOf: [{ $ref: '#/$defs/AgentId' }, { type: 'null' }] }
      occurredAt: { $ref: '#/$defs/Timestamp' }
  Receipt:
    allOf: [{ $ref: '#/$defs/Counters' }]
    type: object
    required: [clientEventId, serverEventId, receivedAt, duplicate, viewRevision, runId, agentId, affected]
    unevaluatedProperties: false
    properties:
      clientEventId: { $ref: '#/$defs/Uuid' }
      serverEventId: { $ref: '#/$defs/Uuid' }
      receivedAt: { $ref: '#/$defs/Timestamp' }
      duplicate: { type: boolean }
      viewRevision: { oneOf: [{ $ref: '#/$defs/Revision' }, { type: 'null' }] }
      runId: { $ref: '#/$defs/RunId' }
      agentId: { $ref: '#/$defs/AgentId' }
      affected: { $ref: '#/$defs/Scope' }
  ComponentSet:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      name: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/Component/properties/name' }
      kind: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/Component/properties/kind' }
      parentComponentId: { oneOf: [{ $ref: '#/$defs/ComponentId' }, { type: 'null' }] }
      description: { type: [string, 'null'], maxLength: 16000 }
      technology:
        oneOf:
          - $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/Technology'
          - type: 'null'
      tags:
        oneOf:
          - allOf: [{ $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/Component/properties/tags' }]
            maxItems: 100
          - type: 'null'
  RelationshipSet:
    type: object
    minProperties: 1
    additionalProperties: false
    properties:
      sourceComponentId: { $ref: '#/$defs/ComponentId' }
      targetComponentId: { $ref: '#/$defs/ComponentId' }
      kind: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/Relationship/properties/kind' }
      label: { type: [string, 'null'], maxLength: 16000 }
      protocol: { type: [string, 'null'], maxLength: 16000 }
      operation: { type: [string, 'null'], maxLength: 16000 }
      channel: { type: [string, 'null'], maxLength: 16000 }
  Operation:
    oneOf:
      - type: object
        required: [op, component]
        additionalProperties: false
        properties:
          op: { const: component.add }
          component: { $ref: '#/$defs/AddedComponent' }
      - type: object
        required: [op, componentId, set]
        additionalProperties: false
        properties:
          op: { const: component.update }
          componentId: { $ref: '#/$defs/ComponentId' }
          set: { $ref: '#/$defs/ComponentSet' }
      - type: object
        required: [op, componentId]
        additionalProperties: false
        properties:
          op: { const: component.remove }
          componentId: { $ref: '#/$defs/ComponentId' }
      - type: object
        required: [op, relationship]
        additionalProperties: false
        properties:
          op: { const: relationship.add }
          relationship: { $ref: '#/$defs/AddedRelationship' }
      - type: object
        required: [op, relationshipId, set]
        additionalProperties: false
        properties:
          op: { const: relationship.update }
          relationshipId: { $ref: '#/$defs/Identifier' }
          set: { $ref: '#/$defs/RelationshipSet' }
      - type: object
        required: [op, relationshipId]
        additionalProperties: false
        properties:
          op: { const: relationship.remove }
          relationshipId: { $ref: '#/$defs/Identifier' }
  ModelMutationPayload:
    type: object
    required: [expectedModelRevision, operations]
    additionalProperties: false
    properties:
      expectedModelRevision: { $ref: '#/$defs/Revision' }
      operations:
        type: array
        minItems: 1
        maxItems: 100
        items: { $ref: '#/$defs/Operation' }
  ModelMutateInput:
    type: object
    allOf:
      - $ref: '#/$defs/WriteIdentity'
      - $ref: '#/$defs/ModelMutationFields'
    unevaluatedProperties: false
  ModelMutationFields:
    description: Open composition of the closed wire payload, without duplicated field shapes.
    type: object
    required: [expectedModelRevision, operations]
    properties:
      expectedModelRevision: { $ref: '#/$defs/ModelMutationPayload/properties/expectedModelRevision' }
      operations: { $ref: '#/$defs/ModelMutationPayload/properties/operations' }
  ModelReadInput:
    allOf: [{ $ref: '#/$defs/ReadIdentity' }, { $ref: '#/$defs/Page' }]
    type: object
    unevaluatedProperties: false
    properties:
      expectedModelRevision: { $ref: '#/$defs/Revision' }
  ModelReadResult:
    allOf: [{ $ref: '#/$defs/Counters' }]
    type: object
    required: [items, nextCursor, diagnostics, diagnosticOverflow]
    unevaluatedProperties: false
    properties:
      items: { type: array, maxItems: 200, items: { $ref: '#/$defs/Element' } }
      nextCursor: { $ref: '#/$defs/NextCursor' }
      diagnostics: { $ref: '#/$defs/Diagnostics' }
      diagnosticOverflow: { type: boolean }
  ElementGetInput:
    allOf: [{ $ref: '#/$defs/ReadIdentity' }]
    type: object
    required: [target]
    unevaluatedProperties: false
    properties:
      target: { $ref: '#/$defs/Target' }
      expectedModelRevision: { $ref: '#/$defs/Revision' }
  ElementGetResult:
    allOf: [{ $ref: '#/$defs/Counters' }]
    type: object
    required: [element]
    unevaluatedProperties: false
    properties:
      element: { $ref: '#/$defs/Element' }
  ContextOpenInput:
    allOf: [{ $ref: '#/$defs/WriteIdentity' }]
    type: object
    required: [role, displayName, assignedTask]
    unevaluatedProperties: false
    properties:
      role: { enum: [orchestrator, subagent] }
      displayName: { type: string, minLength: 1, maxLength: 200 }
      assignedTask: { type: string, minLength: 1, maxLength: 4000 }
  WorkReport:
    oneOf:
      - type: object
        required: [action, workStepId, title, componentIds]
        additionalProperties: false
        properties:
          action: { const: step_start }
          workStepId: { $ref: '#/$defs/Identifier' }
          title: { type: string, minLength: 1, maxLength: 300 }
          componentIds: { $ref: '#/$defs/ComponentIds' }
      - type: object
        required: [action, workStepId, summary]
        additionalProperties: false
        properties:
          action: { const: step_complete }
          workStepId: { $ref: '#/$defs/Identifier' }
          summary: { type: string, minLength: 1, maxLength: 4000 }
      - type: object
        required: [action, status]
        additionalProperties: false
        properties:
          action: { const: status }
          status: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/AgentStatusReportedPayload/properties/status' }
          note: { type: string, maxLength: 4000 }
      - type: object
        required: [action, percent, scope, basis]
        additionalProperties: false
        properties:
          action: { const: progress }
          percent: { type: integer, minimum: 0, maximum: 100 }
          scope: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/AgentProgressReportedPayload/properties/scope' }
          basis: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/AgentProgressReportedPayload/properties/basis' }
          note: { type: string, maxLength: 4000 }
      - type: object
        required: [action, outcome, summary]
        additionalProperties: false
        properties:
          action: { const: agent_finish }
          outcome: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/AgentFinishedPayload/properties/outcome' }
          summary: { type: string, minLength: 1, maxLength: 4000 }
      - type: object
        required: [action, outcome, summary]
        additionalProperties: false
        properties:
          action: { const: run_finish }
          outcome: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/RunFinishedPayload/properties/outcome' }
          summary: { type: string, minLength: 1, maxLength: 4000 }
  WorkReportInput:
    allOf: [{ $ref: '#/$defs/WriteIdentity' }]
    type: object
    required: [report]
    unevaluatedProperties: false
    properties:
      report: { $ref: '#/$defs/WorkReport' }
  BoundaryRelationships:
    description: Existing selected edges omitted because an endpoint is outside the resolved selection.
    type: array
    maxItems: 200
    uniqueItems: true
    items: { $ref: '#/$defs/Identifier' }
  VisibleIds:
    description: At most 200 visible IDs per kind; overflow is reported through clipped.
    additionalProperties: false
    type: object
    required: [componentIds, relationshipIds]
    properties:
      componentIds: { $ref: '#/$defs/ComponentIds' }
      relationshipIds: { $ref: '#/$defs/RelationshipIds' }
  WorkScopeInput:
    allOf: [{ $ref: '#/$defs/WriteIdentity' }]
    type: object
    required: [scope]
    unevaluatedProperties: false
    properties:
      scope: { $ref: '#/$defs/Scope' }
  ContextReadInput:
    allOf: [{ $ref: '#/$defs/ReadIdentity' }, { $ref: '#/$defs/Page' }]
    type: object
    required: [runId]
    unevaluatedProperties: false
    properties:
      runId: { $ref: '#/$defs/RunId' }
  ContextReadResult:
    allOf: [{ $ref: '#/$defs/Counters' }]
    type: object
    required: [runId, isOpen, items, nextCursor]
    unevaluatedProperties: false
    properties:
      runId: { $ref: '#/$defs/RunId' }
      isOpen: { type: boolean }
      nextCursor: { $ref: '#/$defs/NextCursor' }
      items:
        type: array
        maxItems: 200
        items:
          type: object
          required: [agent, scope, scopePosition, missingReferences]
          additionalProperties: false
          properties:
            agent: { $ref: 'urn:visualise-ai:rest:1.1.0#/components/schemas/RunAgent' }
            scope: { oneOf: [{ $ref: '#/$defs/Scope' }, { type: 'null' }] }
            scopePosition: { oneOf: [{ $ref: '#/$defs/Revision' }, { type: 'null' }] }
            missingReferences: { $ref: '#/$defs/Scope' }
  View:
    type: object
    required: [viewId, name, kind, selection, orientation, collapsedComponentIds]
    additionalProperties: false
    properties:
      viewId: { $ref: '#/$defs/Identifier' }
      name: { type: string, minLength: 1, maxLength: 200 }
      kind: { const: architecture }
      selection:
        oneOf:
          - type: object
            required: [mode]
            additionalProperties: false
            properties:
              mode: { const: all }
          - type: object
            required: [mode, scope]
            additionalProperties: false
            properties:
              mode: { const: explicit }
              scope: { $ref: '#/$defs/Scope' }
      orientation: { enum: [top-down, left-to-right] }
      collapsedComponentIds: { $ref: '#/$defs/ComponentIds' }
  ViewsListInput:
    type: object
    allOf: [{ $ref: '#/$defs/ReadIdentity' }, { $ref: '#/$defs/Page' }]
    unevaluatedProperties: false
  ViewsListResult:
    allOf: [{ $ref: '#/$defs/Counters' }]
    type: object
    required: [items, nextCursor]
    unevaluatedProperties: false
    properties:
      nextCursor: { $ref: '#/$defs/NextCursor' }
      items:
        type: array
        maxItems: 200
        items:
          type: object
          required: [viewId, name, kind, viewRevision]
          additionalProperties: false
          properties:
            viewId: { $ref: '#/$defs/Identifier' }
            name: { $ref: '#/$defs/View/properties/name' }
            kind: { const: architecture }
            viewRevision: { $ref: '#/$defs/Revision' }
  ViewGetInput:
    allOf: [{ $ref: '#/$defs/ReadIdentity' }]
    type: object
    required: [viewId]
    unevaluatedProperties: false
    properties:
      viewId: { $ref: '#/$defs/Identifier' }
  ViewGetResult:
    allOf: [{ $ref: '#/$defs/Counters' }]
    type: object
    required: [view, viewRevision, missingReferences, boundaryRelationshipIds]
    unevaluatedProperties: false
    properties:
      view: { $ref: '#/$defs/View' }
      viewRevision: { $ref: '#/$defs/Revision' }
      missingReferences: { $ref: '#/$defs/MissingViewReferences' }
      boundaryRelationshipIds: { $ref: '#/$defs/BoundaryRelationships' }
  ViewPutInput:
    allOf: [{ $ref: '#/$defs/WriteIdentity' }]
    type: object
    required: [expectedModelRevision, expectedViewRevision, view]
    unevaluatedProperties: false
    properties:
      expectedModelRevision: { $ref: '#/$defs/Revision' }
      expectedViewRevision: { $ref: '#/$defs/Revision' }
      view: { $ref: '#/$defs/View' }
  ViewRemoveInput:
    allOf: [{ $ref: '#/$defs/WriteIdentity' }]
    type: object
    required: [expectedViewRevision, viewId]
    unevaluatedProperties: false
    properties:
      expectedViewRevision: { $ref: '#/$defs/Revision' }
      viewId: { $ref: '#/$defs/Identifier' }
  Viewport:
    type: object
    required: [width, height, pixelRatio]
    additionalProperties: false
    properties:
      width: { type: integer, minimum: 320, maximum: 3840 }
      height: { type: integer, minimum: 240, maximum: 2160 }
      pixelRatio: { enum: [1, 2] }
  ViewRenderInput:
    allOf: [{ $ref: '#/$defs/ReadIdentity' }]
    type: object
    required: [viewId, expectedModelRevision, expectedViewRevision, viewport, detailLevel]
    unevaluatedProperties: false
    properties:
      viewId: { $ref: '#/$defs/Identifier' }
      expectedModelRevision: { $ref: '#/$defs/Revision' }
      expectedViewRevision: { $ref: '#/$defs/Revision' }
      viewport: { $ref: '#/$defs/Viewport' }
      detailLevel: { enum: [map, readable, standard, full] }
  ViewRenderResult:
    description: Metadata for exactly one PNG MCP image content block; not the image bytes.
    allOf: [{ $ref: '#/$defs/Counters' }]
    type: object
    required: [viewId, viewRevision, renderedAt, viewport, detailLevel, mimeType, byteLength, missingReferences, boundaryRelationshipIds, visibleIds, clipped]
    unevaluatedProperties: false
    properties:
      viewId: { $ref: '#/$defs/Identifier' }
      viewRevision: { $ref: '#/$defs/Revision' }
      renderedAt: { $ref: '#/$defs/Timestamp' }
      viewport: { $ref: '#/$defs/Viewport' }
      mimeType: { const: image/png }
      byteLength: { type: integer, minimum: 1, maximum: 4194304 }
      missingReferences: { $ref: '#/$defs/MissingViewReferences' }
      boundaryRelationshipIds: { $ref: '#/$defs/BoundaryRelationships' }
      detailLevel: { $ref: '#/$defs/ViewRenderInput/properties/detailLevel' }
      visibleIds: { $ref: '#/$defs/VisibleIds' }
      clipped: { type: boolean }
  ProjectsListInput:
    allOf: [{ $ref: '#/$defs/Page' }]
    type: object
    required: [contractVersion]
    unevaluatedProperties: false
    properties:
      contractVersion: { $ref: '#/$defs/Version' }
  ProjectsListResult:
    type: object
    required: [items, nextCursor]
    additionalProperties: false
    properties:
      items: { type: array, maxItems: 200, uniqueItems: true, items: { $ref: '#/$defs/ProjectId' } }
      nextCursor: { $ref: '#/$defs/NextCursor' }
  DiscoverInput: { type: object, additionalProperties: false }
  DiscoverResult:
    type: object
    required: [contractVersion, tools, viewKinds, limits]
    additionalProperties: false
    properties:
      contractVersion: { $ref: '#/$defs/Version' }
      tools:
        type: array
        maxItems: 14
        uniqueItems: true
        items: { type: string, pattern: '^visualise_[a-z_]+$', maxLength: 64 }
      viewKinds: { type: array, maxItems: 1, uniqueItems: true, items: { const: architecture } }
      limits:
        type: object
        required: [maxOperations, maxPageSize, maxRequestBytes, maxStructuredResponseBytes, maxImageBytes]
        additionalProperties: false
        properties:
          maxOperations: { const: 100 }
          maxPageSize: { const: 200 }
          maxRequestBytes: { const: 1048576 }
          maxStructuredResponseBytes: { const: 1048576 }
          maxImageBytes: { const: 4194304 }
  Error:
    type: object
    required: [code, message, fields]
    additionalProperties: false
    properties:
      code:
        enum: [invalid_input, unsupported_contract_version, project_not_found, run_not_found, element_not_found, element_exists, view_not_found, reference_invalid, revision_conflict, stale_cursor, client_event_id_conflict, run_not_started, run_already_finished, unknown_agent, parent_agent_unknown, agent_already_started, run_already_started, terminal_event_not_allowed, correction_target_unknown, response_too_large, render_failed, render_timeout, cancelled, work_step_not_started, work_step_already_started, internal_error]
      message: { type: string, minLength: 1, maxLength: 2000 }
      fields:
        type: array
        maxItems: 100
        items:
          type: object
          required: [pointer, message]
          additionalProperties: false
          properties:
            pointer: { type: string, pattern: '^(/([^~/]|~[01])*)*$', maxLength: 2048 }
            message: { type: string, minLength: 1, maxLength: 1000 }
      currentModelRevision: { $ref: '#/$defs/Revision' }
      currentViewRevision: { $ref: '#/$defs/Revision' }
      existingProjectPosition: { $ref: '#/$defs/Revision' }
  CommandEvent:
    description: >-
      Future REST ingestion envelope. Generate the concrete branches from this definition;
      never add these names to current server capabilities before implementation.
    type: object
    required: [schemaVersion, clientEventId, projectId, runId, agentId, parentAgentId, occurredAt, type, payload]
    additionalProperties: false
    properties:
      schemaVersion: { const: '2.0' }
      clientEventId: { $ref: '#/$defs/Uuid' }
      projectId: { $ref: '#/$defs/ProjectId' }
      runId: { $ref: '#/$defs/RunId' }
      agentId: { $ref: '#/$defs/AgentId' }
      parentAgentId: { oneOf: [{ $ref: '#/$defs/AgentId' }, { type: 'null' }] }
      occurredAt: { $ref: '#/$defs/Timestamp' }
      type: { enum: [context.opened, work.reported, model.mutation_applied, work.scope_reported, view.saved, view.removed] }
      payload: { type: object }
    oneOf:
      - properties:
          type: { const: context.opened }
          payload:
            type: object
            required: [role, displayName, assignedTask]
            additionalProperties: false
            properties:
              role: { $ref: '#/$defs/ContextOpenInput/properties/role' }
              displayName: { $ref: '#/$defs/ContextOpenInput/properties/displayName' }
              assignedTask: { $ref: '#/$defs/ContextOpenInput/properties/assignedTask' }
      - properties:
          type: { const: work.reported }
          payload:
            type: object
            required: [report]
            additionalProperties: false
            properties:
              report: { $ref: '#/$defs/WorkReport' }
      - properties:
          type: { const: model.mutation_applied }
          payload: { $ref: '#/$defs/ModelMutationPayload' }
      - properties:
          type: { const: work.scope_reported }
          payload:
            type: object
            required: [scope]
            additionalProperties: false
            properties:
              scope: { $ref: '#/$defs/WorkScopeInput/properties/scope' }
      - properties:
          type: { const: view.saved }
          payload:
            type: object
            required: [expectedModelRevision, expectedViewRevision, view]
            additionalProperties: false
            properties:
              expectedModelRevision: { $ref: '#/$defs/ViewPutInput/properties/expectedModelRevision' }
              expectedViewRevision: { $ref: '#/$defs/ViewPutInput/properties/expectedViewRevision' }
              view: { $ref: '#/$defs/ViewPutInput/properties/view' }
      - properties:
          type: { const: view.removed }
          payload:
            type: object
            required: [expectedViewRevision, viewId]
            additionalProperties: false
            properties:
              expectedViewRevision: { $ref: '#/$defs/ViewRemoveInput/properties/expectedViewRevision' }
              viewId: { $ref: '#/$defs/ViewRemoveInput/properties/viewId' }
