# Nginx is the only externally reachable entry point of the deployment.
# It serves the production React bundle and proxies the internal backend.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the backend at request time keeps Nginx
    # alive across a backend restart instead of failing at configuration load.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    client_max_body_size 8m;

    # ---- Server-Sent Events -------------------------------------------------
    # Must be declared before the generic /api/ prefix: regex locations win.
    # Buffering, caching and chunked re-encoding are disabled so every event
    # reaches the browser the moment the backend commits it.
    location ~ ^/api/v1/projects/[^/]+/stream$ {
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        gzip off;

        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        add_header X-Accel-Buffering no always;
    }

    # ---- UI read API and agent event ingestion ------------------------------
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---- Backend probes -----------------------------------------------------
    location = /healthz {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /readyz {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # ---- Static bundle ------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Client-side routing: unknown paths fall back to the SPA entry point.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
