# Optional override for running the images published by the release workflow.
# The base compose file remains the source-build path for local development.
services:
  backend:
    build: !reset null
    image: "risqy3d/visualise-ai-backend:${IMAGE_TAG:-latest}"

  frontend:
    build: !reset null
    image: "risqy3d/visualise-ai-frontend:${IMAGE_TAG:-latest}"
