name: CI

# The fast suites. They are cheap enough to run on every push and they are what
# tells a contributor *where* something broke; the mandatory end-to-end
# acceptance run (issue #14) lives in `e2e.yml` because it needs Docker, a build
# of every service and a real browser.

# `push` is limited to the default branch on purpose: with `branches: ['**']` a
# branch that has an open pull request is built twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to validate when called by a release workflow'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm test
        working-directory: api

  backend:
    name: backend (go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - name: Test all packages against PostgreSQL
        shell: bash
        run: |
          if [[ ! "${TEST_DATABASE_URL:-}" =~ [^[:space:]] ]]; then
            echo "::error::TEST_DATABASE_URL is required for PostgreSQL-backed tests."
            exit 1
          fi
          # Store and MCP fixtures share the default schema. Keep packages
          # serial so truncation/migration cannot invalidate another suite.
          go test -count=1 -p 1 ./...
        working-directory: backend

  frontend:
    name: frontend (react)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # The generated contract types must match the checked-in contract, or the
      # frontend would be typed against a document nobody published.
      - run: npm run check:contract
        working-directory: frontend

      # The two catalogue guards run as steps of their own, before the suite.
      #
      # Both are also executed by Vitest (`src/i18n/catalogues.test.ts`,
      # `src/i18n/uiStrings.test.ts`), which is what proves they *work* — those
      # tests run them against deliberately broken catalogues as well. What a
      # named step adds is the failure being readable: "check locale catalogues"
      # in red says a key is missing in one language, where "frontend (react)"
      # in red says something among 400-odd tests went wrong. Issue #37 asks for
      # catalogue parity to be validated in CI; this is where that happens.
      - name: Check locale catalogues (key parity across languages)
        run: npm run check:locales
        working-directory: frontend
      - name: Check for UI text outside the catalogues
        run: npm run check:ui-strings
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  simulator:
    name: simulator (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: simulator/package-lock.json
      - run: npm ci
        working-directory: simulator
      - run: npm run lint
        working-directory: simulator
      - run: npm run typecheck
        working-directory: simulator
      - run: npm test
        working-directory: simulator
